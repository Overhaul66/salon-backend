# Render Blueprint — https://render.com/docs/blueprint-spec
databases:
  - name: salon-db
    plan: free

services:
  - type: web
    name: salon-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate --noinput && python manage.py seed_catalog && gunicorn config.wsgi:application --workers 2 --timeout 120"
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salon-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "salon-api.onrender.com"
      - key: MEDIA_ROOT
        value: "/var/data/media"
      - key: PYTHON_VERSION
        value: "3.13.2"
    disk:
      name: salon-media
      mountPath: /var/data
      sizeGB: 1
